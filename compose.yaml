version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bcsaude-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-postgresql://bcsaude_user:bcsaude_secure_pass@postgres:5432/bcsaude?schema=public}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://bcsaude.com.br}

