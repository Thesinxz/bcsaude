version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bcsaude-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/prisma/dev.db
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://bcsaude.com.br}
    volumes:
      - bcsaude_data:/app/prisma

volumes:
  bcsaude_data:
    driver: local
